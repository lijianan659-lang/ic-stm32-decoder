[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ic-stm32-decoder"
version = "1.7.0"
description = "Zero-dependency IC top marking lookup (210 SMD codes), cross-reference trap checker (48 pairs), SMD IC package dimensions (16 JEDEC/EIAJ outlines), IC date code decoder, and STM32 part number decoder."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "PartVane Engineering", email = "sales@partvane.com" }
]
keywords = [
  "ic-date-code",
  "date-code-decoder",
  "yyww",
  "julian-date",
  "onsemi",
  "national-semiconductor",
  "stm32",
  "electronic-components",
  "bom",
  "iqc"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: JavaScript",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)"
]
dependencies = []

[project.urls]
Homepage = "https://www.partvane.com/tools/"
Repository = "https://github.com/lijianan659-lang/ic-stm32-decoder"
"IC Top Marking Lookup" = "https://www.partvane.com/tools/ic-marking-decoder/"
"IC Date Code Decoder" = "https://www.partvane.com/tools/date-code-decoder/"
"Manufacturer Date Code Formats" = "https://www.partvane.com/tools/date-code-formats/"
"STM32 Part Number Decoder" = "https://www.partvane.com/tools/stm32-part-number-decoder/"
"IC MSL Bake Calculator" = "https://www.partvane.com/tools/msl-calculator/"
"AEC-Q100 Automotive Suffix Decoder" = "https://www.partvane.com/tools/aec-q100-grade-decoder/"
"IC Cross-Reference & Trap Checker" = "https://www.partvane.com/tools/cross-reference/"
"SMD IC Package Dimensions" = "https://www.partvane.com/tools/ic-package-dimensions/"

[project.scripts]
ic-stm32-decoder = "ic_stm32_decoder.cli:main"

[tool.setuptools.packages.find]
include = ["ic_stm32_decoder*"]
